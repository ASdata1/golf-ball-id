[project]
name = "golfball"
version = "0.1.0"
description = "Identify golf ball model from launch monitor data and impact sound"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "soundfile",
    "pandera",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "dvc"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
